<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert Reels Redesign</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1bgNMQ5fTTGPpITLymz31uXlnG_r7c-lO" />
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: () => {} // silently ignore
        });
      } catch (e) {
        console.error("Failed to patch fetch", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
